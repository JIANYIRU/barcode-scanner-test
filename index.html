<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1"
  >

  <title>智慧抄貨系統</title>

  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <main class="page">
    <section class="system-card">
      <h1>智慧抄貨系統</h1>

      <div class="divider"></div>

      <div class="form-row">
        <div class="field-group">
          <label for="channel">通路</label>

         <select id="channel">
  <option value="">正在載入通路...</option>
</select>
        </div>

        <div class="field-group">
          <label for="branch">店家</label>

        <select id="branch">
  <option value="">請先選擇通路</option>
</select>
        </div>

        <div class="field-group date-group">
          <label for="orderDate">日期</label>

          <input
            id="orderDate"
            type="date"
            value="2026-08-03"
          >
        </div>
      </div>

      <div class="divider"></div>

      <button id="startButton" type="button">
        開始抄貨
      </button>
    </section>
  </main>

<script src="js/api.js?v=3"></script>
<script src="js/main.js?v=3"></script>
  
</body>
</html>
