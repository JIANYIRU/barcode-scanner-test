<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>開始抄貨</title>

  <link rel="stylesheet" href="css/style.css?v=27">
</head>

<body>
  <main class="page">
    <h1>新增抄貨單</h1>

    <div class="divider"></div>

    <div id="orderInfo"></div>

    <div class="divider"></div>

 <div class="scan-actions">
  <button id="scanButton" type="button">
    開啟相機
  </button>

  <button id="manualButton" type="button">
    手動輸入條碼
  </button>
</div>

<!-- 手動輸入條碼／商品搜尋區 -->
<div
  id="manualSearchArea"
  class="manual-search-area"
  hidden>

  <div class="manual-search-bar">

    <input
      id="manualSearchKeyword"
      type="text"
      placeholder="輸入商品名稱或條碼，例如：220 毛巾"
    >

    <button
      id="manualSearchSubmitButton"
      type="button">
      搜尋
    </button>

  </div>

  <!-- 搜尋結果會由 JavaScript 放進這裡 -->
  <div
    id="manualSearchResult"
    class="manual-search-result">
  </div>

  <!-- 有勾選商品時才顯示 -->
  <button
    id="addManualSelectedButton"
    class="primary-button"
    type="button"
    hidden>
    加入商品列表
  </button>

  <button
    id="closeManualSearchButton"
    type="button">
    關閉
  </button>

</div>    

<div id="cameraArea" class="camera-area" hidden>
  <div id="reader"></div>
  <div id="zoomControls" class="zoom-controls" hidden>
  <label for="zoomSlider">
    相機變焦：<span id="zoomValue">1</span>x
  </label>

  <input
    id="zoomSlider"
    type="range"
    min="1"
    max="1"
    step="0.1"
    value="1"
  >
</div>

  <button id="closeCameraButton" type="button">
    關閉相機
  </button>

  <p id="cameraStatus"></p>
</div>

    <div class="divider"></div>

<div id="productPreview" hidden>

  <div class="preview-card">

    <div
      id="previewBarcode"
      class="preview-barcode">
    </div>

    <div
      id="previewName"
      class="preview-name">
    </div>

    <hr>

    <div class="quantity-row">

      <span class="quantity-title">
        數量
      </span>

      <button
        id="minusButton"
        type="button">
        −
      </button>

      <input
        id="quantityInput"
        type="number"
        value="1"
        min="1">

      <button
        id="plusButton"
        type="button">
        +
      </button>

    </div>

    <hr>

    <div class="remark-title">
      備註
    </div>

    <textarea
      id="remarkInput"
      rows="3"
      placeholder="輸入備註（可略過）">
    </textarea>

    <button
      id="addProductButton"
      class="primary-button"
      type="button">

      加入抄貨列表

    </button>

  </div>

</div>

<div id="productList">

</div>

    <div class="divider"></div>

    <div class="order-actions">
      <button id="saveButton" type="button">
        暫存
      </button>

      <button id="completeButton" type="button">
        完成抄貨
      </button>
    </div>
  </main>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  
<script src="js/api.js?v=42"></script>
<script src="js/storage.js?v=33"></script>
<script src="js/utils.js?v=32"></script>
<script src="js/order.js?v=38"></script>
<script src="js/camera.js?v=32"></script>
<script src="js/scan.js?v=37"></script>
</body>

</html>
