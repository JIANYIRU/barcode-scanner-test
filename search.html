<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1"
  >

  <title>搜尋商品條碼</title>

  <link rel="stylesheet" href="css/style.css?v=29">
</head>

<body>

  <main class="page">

    <section class="system-card">

      <h1>搜尋商品條碼</h1>

      <div class="divider"></div>

      <div class="product-search-box">

        <input
          id="searchKeyword"
          type="text"
          placeholder="輸入商品名稱或條碼，例如：220 毛巾"
        >

        <button
          id="searchProductButton"
          type="button">
          搜尋
        </button>

      </div>

      <div class="divider"></div>

      <div id="searchSummary"></div>

      <div id="searchResult"></div>

      <div class="divider"></div>

      <a
        class="dashboard-button"
        href="index.html">
        返回首頁
      </a>

    </section>

  </main>

  <script src="js/api.js?v=42"></script>
  <script src="js/search.js?v=2"></script>

</body>

</html>
